
name: Build CodeZenzi APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find Android project
        id: android
        shell: bash
        run: |
          echo "Searching for settings.gradle..."
          find . -type f -name settings.gradle -print
          PROJECT_FILE="$(find . -type f -name settings.gradle | grep '/android-wrapper/settings.gradle$' | head -n 1)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Could not find android-wrapper/settings.gradle"
            exit 1
          fi
          PROJECT_DIR="${PROJECT_FILE%/settings.gradle}"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build CodeZenzi APK
        run: gradle --no-daemon -p "${{ steps.android.outputs.project_dir }}" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeZenzi-debug-apk
          path: ${{ steps.android.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
